# Always Forward · Netlify build settings
# If the git root is movingalwaysforward/ (this folder is a subfolder), uncomment the base line.
[build]
  command = "npm run build"
  publish = "dist"
  # base = "build"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Decap CMS at /admin/: keep it out of search results (same-origin framing is already set above).
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
